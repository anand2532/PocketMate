[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketmate-ui"
version = "0.4.0"
description = "PocketMate 800x480 QML UI (PySide6 prototype host, ARCHITECTURE.md §4)"
requires-python = ">=3.11"
# PySide6 comes from Debian (python3-pyside6.*) on the device, so it is not a pip dependency here
# (pip would pull the 200+ MB PyPI wheel). Dev: `pip install PySide6` separately.
dependencies = ["pocketmate"]

[project.scripts]
pm-ui = "pocketmate_ui.__main__:main"

[tool.setuptools.packages.find]
include = ["pocketmate_ui*"]

[tool.setuptools.package-data]
pocketmate_ui = ["qml/*.qml", "qml/screens/*.qml", "qml/qmldir"]
