<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- PLACEHOLDER (not used by v0.4.0 code; see README.md) -->
<busconfig>
  <policy user="pm-power"><allow own="org.pocketmate.Power"/></policy>
  <policy user="pm-audio"><allow own="org.pocketmate.Audio"/></policy>
  <policy user="pm-core"><allow own="org.pocketmate.Core"/></policy>
  <policy user="pm-cloud"><allow own="org.pocketmate.Cloud"/></policy>
  <policy group="pm">
    <allow send_destination="org.pocketmate.Power"/>
    <allow send_destination="org.pocketmate.Audio"/>
    <allow send_destination="org.pocketmate.Core"/>
  </policy>
  <!-- only pm-core may call pm-cloud (§5.2) -->
  <policy user="pm-core"><allow send_destination="org.pocketmate.Cloud"/></policy>
  <policy context="default"><deny send_destination="org.pocketmate.Cloud"/></policy>
</busconfig>
