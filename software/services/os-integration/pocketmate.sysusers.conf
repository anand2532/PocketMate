# sysusers.d/pocketmate.conf [impl v0.4.0] — one UID per service so nftables can match egress by UID (P10)
g pm      -     -
g pm-mic  -     -
u pm        -   "PocketMate UI"            /var/lib/pm  /usr/sbin/nologin
u pm-core   -   "PocketMate core"          /var/lib/pm  /usr/sbin/nologin
u pm-audio  -   "PocketMate audio"         /var/lib/pm  /usr/sbin/nologin
u pm-power  -   "PocketMate power"         /var/lib/pm  /usr/sbin/nologin
u pm-llm    -   "PocketMate LLM"           /var/lib/pm  /usr/sbin/nologin
u pm-cloud  -   "PocketMate cloud adapter" /var/lib/pm  /usr/sbin/nologin
u pm-lte    -   "PocketMate LTE"           /var/lib/pm  /usr/sbin/nologin
m pm pm
m pm-core pm
m pm-audio pm
m pm-audio pm-mic
m pm-power pm
m pm-llm pm
m pm-cloud pm
m pm-lte pm
