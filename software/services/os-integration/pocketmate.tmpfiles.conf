# tmpfiles.d/pocketmate.conf [impl v0.4.0]
d /run/pm            0770 root     pm       -
d /run/pm/blobs      0770 root     pm       -
d /var/lib/pm/state  0770 root     pm       -
d /var/lib/pm/secrets 0750 pm-core pm-cloud -

