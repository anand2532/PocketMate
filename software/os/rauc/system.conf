# /etc/rauc/system.conf (ARCHITECTURE.md §2.2). Slot devices by GPT PARTLABEL (partitions/cm5-4g.sfdisk).
[system]
compatible=PocketMate cm5-4g
bootloader=custom
bundle-formats=-plain
statusfile=/var/lib/pm/rauc.status
max-bundle-download-size=4294967296

[keyring]
# Public keyring only (root CA + CRL). Built into the rootfs from os/keys/public/; NO private keys anywhere.
path=/etc/rauc/keyring.pem
check-crl=true

[handlers]
bootloader-custom-backend=/usr/lib/pocketmate/rauc-tryboot-backend

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-A
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-B
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partlabel/boot-A
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partlabel/boot-B
type=vfat
parent=rootfs.1

[slot.models.0]
device=/dev/disk/by-partlabel/models-A
type=ext4
parent=rootfs.0

[slot.models.1]
device=/dev/disk/by-partlabel/models-B
type=ext4
parent=rootfs.1
