#!/usr/sbin/nft -f
# PocketMate egress policy (§2 Networking, P10): default-deny outbound except the pm-cloud and pm-update
# UIDs, plus the OS plumbing that needs it (DHCP, DNS via systemd-resolved, NTP via chrony).
flush ruleset
table inet pm {
    chain output {
        type filter hook output priority 0; policy drop;
        oif "lo" accept
        ct state established,related accept
        udp sport 68 udp dport 67 accept                          comment "DHCPv4 (NetworkManager/networkd)"
        icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } accept
        meta skuid "systemd-resolve" udp dport 53 accept
        meta skuid "systemd-resolve" tcp dport { 53, 853 } accept
        meta skuid "_chrony" udp dport 123 accept
        meta skuid "pm-cloud" tcp dport 443 accept
        meta skuid "pm-update" tcp dport 443 accept
        counter log prefix "pm-egress-drop " limit rate 5/minute drop
    }
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        udp sport 67 udp dport 68 accept
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }
}
